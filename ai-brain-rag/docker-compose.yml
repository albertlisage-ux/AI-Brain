services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-brain-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage:delegated
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # indexer 改为在宿主机直接运行（利用 Ollama Metal GPU 加速）
  # 启动方式: bash run-indexer-host.sh
  # 详见 ai-rag-setup-guide.md#宿主机模式

  rag-api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    container_name: ai-brain-rag-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=ai-brain
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./data/model-cache:/model-cache:delegated

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: ai-brain-mcp-server
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=ai-brain
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ${OBSIDIAN_VAULT_PATH:-.}:/vault:ro
